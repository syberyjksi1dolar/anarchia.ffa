name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        working-directory: anarchia.ffa/anarchia.ffa
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: anarchia.ffa
          path: anarchia.ffa/anarchia.ffa/build/libs/*.jar
